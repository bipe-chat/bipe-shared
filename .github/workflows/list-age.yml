# bipe-chat/bipe#1242: each day, check that the signed lists are fresh on main and at the core (tools/check-list-age.mjs).
# It runs on GitHub, so it also reports a mini4p that is off or logged out. On a problem it opens one issue on
# bipe-chat/bipe, or comments on the open one. Needs the secret BIPE_REPOS_TOKEN with Issues read and write on
# bipe-chat/bipe (as parity-report.yml).
name: Signed list age

on:
  schedule:
    - cron: "0 12 * * *" # daily, 09:00 in São Paulo, two hours after the job on mini4p
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: age
        run: node tools/check-list-age.mjs | tee "$RUNNER_TEMP/list-age.txt"
      - if: failure() && steps.age.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.BIPE_REPOS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Signed lists: re-sign or publish is overdue"
          body=$(printf '%s\n\n%s\n\n%s\n' "$(sed -n 's/^::error:://p' "$RUNNER_TEMP/list-age.txt")" "Run: $RUN_URL" "Job: bipe-shared scripts/resign-lists.sh on mini4p, log ~/Library/Logs/bipe-list-resign.log (docs/signed-lists.md \"Signing\").")
          number=$(gh issue list --repo bipe-chat/bipe --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo bipe-chat/bipe --body "$body"
          else
            gh issue create --repo bipe-chat/bipe --title "$title" --body "$body"
          fi
