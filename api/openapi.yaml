openapi: 3.1.0
info:
  title: Bipe API
  version: 0.1.0
  description: >
    Verification, badges and directories. Skeleton contract: shapes are stable
    identifiers shared by iOS, Android and the web console. Auth: Matrix access
    token validated against MAS (OIDC).
servers:
  - url: https://api.bipe.net.br
paths:
  /v1/badges/{userId}:
    get:
      summary: Current badge envelope for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Badge envelope (verify locally, see docs/badge-attestation.md)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BadgeEnvelope" }
        "404":
          description: User has no badge
  /v1/verifications/pix:
    post:
      summary: Start a Pix verification for the caller
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf: { type: string, pattern: "^\\d{11}$", description: "Digits only. Hashed on receipt, never stored in clear." }
      responses:
        "201":
          description: Pix charge to pay from the user's own bank account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PixChallenge" }
  /v1/verifications/{verificationId}:
    get:
      summary: Verification status
      parameters:
        - name: verificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationStatus" }
  /v1/attest/challenge:
    post:
      summary: One-time App Attest challenge for sign-up (valid 5 minutes, single use)
      description: >
        No auth. The iOS app hashes the UTF-8 bytes of the challenge (SHA-256) and passes
        that as clientDataHash to DCAppAttestService.attestKey. Rate-limited per IP.
      responses:
        "200":
          description: Challenge
          content:
            application/json:
              schema:
                type: object
                required: [challenge]
                properties:
                  challenge: { type: string }
        "429": { $ref: "#/components/responses/Error" }
  /v1/signup:
    post:
      summary: Create an account (docs/usernames.md option A)
      description: >
        No auth. The server creates a random Matrix localpart through the MAS admin API,
        consumes one invite use when a code is given and, if given, reserves the handle.
        Rate-limited per IP and globally per hour. Two modes.
        Device-first (ADR 0057, ADR 0059): the request has no password. The server makes a
        random password of 32 bytes, sets it through the MAS admin API and returns it once,
        with a recovery token of 32 bytes. The server stores neither in clear: it never stores
        the password, and it keeps only the SHA-256 of the token. The app keeps the password on
        this device only (iOS Keychain ThisDeviceOnly, Android storage without backup), syncs the
        token (iCloud Keychain, Block Store), and signs in with m.login.password (user_id and
        password). An optional pin is set at once (pinProblem() in registries/accounts.json).
        An optional email is a recovery fallback, never a login: it is not given to MAS, and
        the server sends a link to confirm it (when outgoing email is on).
        Legacy (beta apps): email and password both given. The server sets both in MAS as before
        and the client signs in through MAS with them. A password without an email is bad_request.
        The response has cache-control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/account:
    get:
      summary: The caller's device-first account state (ADR 0057)
      description: >
        PIN state, the recovery email, the recovery token and the recoveries that are running or
        ended in the last 7 days. Apps read it when they come to the foreground: a recovery in
        state waiting is the alert for the old devices (they show it and offer cancel); a
        completed token recovery tells that the account signed in on a new device.
      security: [{ matrix: [] }]
      responses:
        "200":
          description: State
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStatus" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/me/pin:
    put:
      summary: Set or change the caller's PIN
      description: >
        A signed-in device sets the PIN after a biometric check on the device (client side, ADR
        0057). No old PIN is needed. The PIN must pass pinProblem() (400 pin_weak, reason: a
        PinProblem id). Setting the PIN unblocks it, sets the wrong-try count to 0 and cancels
        every waiting PIN reset. The server sends a notice to the verified recovery email.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, maxLength: 64 }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/pin/check:
    post:
      summary: Check the caller's PIN (for a PIN reminder)
      description: >
        A wrong PIN counts against the account like on the recovery paths: 403 pin_wrong with
        tries_left, then 403 pin_blocked after pinMaxWrongTries in total. A correct PIN sets the
        count to 0. 409 pin_not_set when the account has no PIN. The app lock does not use this
        route: it checks on the device.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin: { type: string, maxLength: 64 }
      responses:
        "204": { description: Correct }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/device-first:
    post:
      summary: Move a beta account (email and own password) to a hidden password
      description: >
        For accounts made before ADR 0057. Needs a PIN first (409 pin_not_set). The server sets a
        new random password through the MAS admin API and issues a new recovery token, and
        returns both once. The user's own password stops working. The MAS email stays (it does
        not sign in without the password); to use email for recovery, the app adds it with PUT
        /v1/me/email. Also for a device-first account whose app lost the stored password.
      security: [{ matrix: [] }]
      responses:
        "200":
          description: New credentials, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credentials" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/recovery-token:
    post:
      summary: Issue a new recovery token for the caller
      description: >
        Returned once. The old token stops working. For an app that lost the synced token, or
        after a suspected leak.
      security: [{ matrix: [] }]
      responses:
        "200":
          description: The new token
          content:
            application/json:
              schema:
                type: object
                required: [recovery_token]
                properties:
                  recovery_token: { type: string, description: "base64url, 32 random bytes." }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/email:
    put:
      summary: Add or change the caller's recovery email
      description: >
        The server sends a link to confirm the address (emailVerifyLinkHours). The current
        verified address stays in use until the new one is confirmed. 503 email_unavailable when
        outgoing email is off. 409 email_taken when another account uses the address.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                lang: { type: string, enum: [pt, en], default: pt, description: "Language of the emails Bipe sends to this address." }
      responses:
        "202": { description: Link sent }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove the caller's recovery email (verified and pending)
      description: The server sends a notice to the removed verified address.
      security: [{ matrix: [] }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
  /v1/email/verify:
    post:
      summary: Confirm a recovery email with the token from the link
      description: >
        No auth: the token proves the inbox. The link is PUBLIC_SITE_URL/confirmar-email/#<token>,
        so the token stays out of server logs; the app or the web page reads it from the fragment.
        CORS allows PUBLIC_SITE_URL. 403 recovery_invalid when the token is unknown or expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 128 }
      responses:
        "204": { description: Confirmed }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/recoveries/{recoveryId}/cancel:
    post:
      summary: Cancel a waiting recovery of the caller's account (old device)
      description: Any signed-in device of the account can cancel. 404 when the recovery is not waiting.
      security: [{ matrix: [] }]
      parameters:
        - { name: recoveryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/recovery/token:
    post:
      summary: Get back in with the synced recovery token and the PIN (ADR 0059)
      description: >
        No auth. Rate-limited per IP. The server finds the account by the token first, and only
        then checks the PIN, so nobody can use up the tries without the token. Wrong PIN: 403
        pin_wrong with tries_left; blocked PIN: 403 pin_blocked (reset by email, guardians or
        CPF). Unknown token: 403 recovery_invalid. On success the server sets a new random
        password through the MAS admin API, issues a new token (the old one stops working),
        records a completed recovery that the old devices see in GET /v1/me/account, and
        sends a notice to the verified recovery email. No delay. Message history still needs
        approval from an old device or the recovery key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recovery_token, pin]
              properties:
                recovery_token: { type: string, maxLength: 128 }
                pin: { type: string, maxLength: 64 }
      responses:
        "200":
          description: New credentials, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credentials" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/recovery/email:
    post:
      summary: Ask for a recovery link by email (ADR 0057)
      description: >
        No auth. Always 202 for a well-formed request, so the route never tells whether an
        address is known. When a verified recovery email matches, the server sends a link
        PUBLIC_SITE_URL/recuperar/#<token>, valid for recoveryLinkMinutes. The app on the new
        device opens it and calls POST /v1/recovery/email/confirm. Rate-limited per IP and per
        address. 503 email_unavailable when outgoing email is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/recovery/email/confirm:
    post:
      summary: Start the delay with the email link and the PIN, or a new PIN
      description: >
        No auth. Exactly one of pin and new_pin. With pin (access): the server checks the link
        first and then the PIN (403 pin_wrong with tries_left, 403 pin_blocked). With new_pin
        (forgotten or blocked PIN): no old PIN; new_pin must pass pinProblem() (400 pin_weak).
        Then the delay starts (recoveryDelayHours.email), the old devices see the recovery in
        GET /v1/me/account and can cancel, and the server sends a notice to the recovery email.
        The response carries a claim secret, shown once; the new device keeps it and calls
        POST /v1/recovery/{recoveryId}/claim. The link works once. 403 recovery_invalid for an
        unknown, used or expired link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 128 }
                pin: { type: string, maxLength: 64 }
                new_pin: { type: string, maxLength: 64 }
      responses:
        "201":
          description: Delay started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryStarted" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/recovery/{recoveryId}/claim:
    post:
      summary: Poll a recovery, and collect the result when the delay has ended
      description: >
        No auth; the claim secret from RecoveryStarted proves the device. Before ready_at:
        state waiting. After ready_at: for purpose access the server sets a new random password
        through the MAS admin API and issues a new recovery token, and returns user_id, password
        and recovery_token once; for purpose pin_reset the new PIN takes effect (unblocked, count
        0). State completed after that. A completed access recovery can be claimed again for one
        hour (a lost response): each claim sets a new password and token. Cancelled and expired
        recoveries return their state. After the delay the device has recoveryClaimDays to claim.
        403 recovery_invalid for an unknown recovery or a wrong secret.
      parameters:
        - { name: recoveryId, in: path, required: true, schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_secret]
              properties:
                claim_secret: { type: string, maxLength: 128 }
      responses:
        "200":
          description: State, and the credentials when completed now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryClaim" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/invites/{code}:
    get:
      summary: Preview an invite before sign-up
      description: >
        No auth. Rate-limited per IP. Tells the invite page and the app whether a code
        can still be used, and the inviter's handle when they have one. The code is a
        secret the inviter shared, so showing the inviter's handle to its holder is intended.
        CORS allows https://bipe.chat.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/events:
    post:
      summary: Count one experiment event (headline test, issue #77)
      description: >
        No auth. Sent by the public site with navigator.sendBeacon, so the body arrives as
        text/plain JSON and the browser reads no response. The server adds 1 to a daily
        counter per experiment, arm and event. It stores no IP, no identifier and no
        per-person row. Rate-limited per IP and globally. Always 204 for a well-formed request.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { $ref: "#/components/schemas/ExperimentEvent" }
          application/json:
            schema: { $ref: "#/components/schemas/ExperimentEvent" }
      responses:
        "204": { description: Counted }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/waitlist:
    post:
      summary: Join the waitlist for a platform that has no build yet
      description: >
        No auth. Called from the public site (CORS allows https://bipe.chat).
        Rate-limited per IP and globally. Always answers 202 for a well-formed request,
        also when the email is already on the list, so the endpoint never tells whether an
        address is known. Bipe emails the address once, when the platform ships, and
        never for anything else. The address is deleted after that email or on request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitlistRequest" }
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/partners:
    post:
      summary: Ask to partner with Bipe (organisations)
      description: >
        No auth. Called from the partner page on the public site (CORS allows https://bipe.chat).
        Rate-limited per IP and globally. Always answers 202 for a well-formed request, the
        honeypot included. The API stores the request and emails a notice to the partner inbox
        (BIPE_PARTNERS_TO) when outgoing email is on. Requests are deleted after 365 days or on
        request. ADR 0067, issue bipe#177.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerRequest" }
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/invites:
    get:
      summary: The caller's personal invites and quota
      security: [{ matrix: [] }]
      responses:
        "200":
          description: Quota and invites, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyInvites" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      summary: Create one personal invite
      description: >
        Single use, expires after 30 days. The code is returned once and stored only as
        a hash. Fails with invite_quota_exhausted when no invite is available. Slots come
        back: a used invite frees its slot INVITE_RESPAWN_DAYS after the invitee joined.
      security: [{ matrix: [] }]
      responses:
        "201":
          description: New invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvite" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/contacts/lookup:
    post:
      summary: Find address-book contacts on Bipe by phone number
      description: >
        Phase 0 of phone-number discovery (bipe/docs/phone-link.md). The client sends
        numbers it normalised with registries/phone-numbers.json; the server normalises again
        and ignores the rest. It compares HMACs with linked numbers and returns only matches
        whose holder allows discovery. The submitted list is never stored. Limits: 500 numbers
        per request, a daily budget per account (lower for accounts younger than 7 days),
        30 requests per hour.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phones]
              properties:
                phones: { type: array, maxItems: 500, items: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: object
                required: [matches]
                properties:
                  matches:
                    type: array
                    items:
                      type: object
                      required: [phone, user_id]
                      properties:
                        phone: { type: string, description: "The matched number in E.164, as normalised by the server." }
                        user_id: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/phone:
    get:
      summary: The caller's linked phone number status (never the number)
      security: [{ matrix: [] }]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [linked, discoverable_by_phone]
                properties:
                  linked: { type: boolean }
                  method: { type: string, enum: [admin, pix, sms] }
                  linked_at: { type: string, format: date-time }
                  confirm_by: { type: string, format: date-time, description: "After this date the number stops being discoverable until confirmed again." }
                  discoverable_by_phone: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: Unlink the caller's phone number
      security: [{ matrix: [] }]
      responses:
        "204": { description: Unlinked }
        "401": { $ref: "#/components/responses/Error" }
  /v1/me/discovery:
    get:
      summary: Who can find the caller
      security: [{ matrix: [] }]
      responses:
        "200":
          description: Setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverySettings" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      summary: Change who can find the caller
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoverySettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverySettings" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/me/invite-connections:
    get:
      summary: The caller's invite pairs
      description: >
        People the caller invited with a personal invite who joined, plus the person who
        invited the caller. Clients treat a direct-chat invite from these users as trusted:
        it skips message requests and is accepted automatically (bipe/docs/adr ADR 0034).
      security: [{ matrix: [] }]
      responses:
        "200":
          description: Matrix user IDs
          content:
            application/json:
              schema:
                type: object
                required: [user_ids]
                properties:
                  user_ids: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/me/invites/{inviteId}:
    delete:
      summary: Revoke one of the caller's pending invites
      description: The invite goes back to the caller's available count. Used invites cannot be revoked.
      security: [{ matrix: [] }]
      parameters:
        - { name: inviteId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/handles/{handle}/availability:
    get:
      summary: Check a handle before sign-up or change
      description: No auth. Rate-limited per IP. Never reveals who holds a handle.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandleAvailability" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/handles/{handle}:
    get:
      summary: Exact handle lookup (no search, no directory)
      security: [{ matrix: [] }]
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current holder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandleRecord" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/handles/resolve:
    post:
      summary: Handles for Matrix IDs, for display (max 100 per call)
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids: { type: array, maxItems: 100, items: { type: string } }
      responses:
        "200":
          description: Map of Matrix ID to handle. IDs without a handle are absent.
          content:
            application/json:
              schema:
                type: object
                required: [handles]
                properties:
                  handles: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Error" }
  /v1/me/messaging:
    get:
      summary: Who can message the caller (default everyone)
      security: [{ matrix: [] }]
      responses:
        "200":
          description: Current setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagingSetting" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      summary: Change who can message the caller
      description: >
        Enforced by the server: a Synapse module refuses invites (DMs and groups) that the
        setting does not allow. Contacts (a shared joined room or an invite pair, ADR 0034)
        can always invite. "verified" also admits verified accounts; none exist yet.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessagingSetting" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagingSetting" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/business:
    get:
      summary: The caller's CNPJ claim (ADR 0042)
      security: [{ matrix: [] }]
      responses:
        "200":
          description: The claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessClaim" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Start a CNPJ claim for the caller's account
      description: >
        One claim per account. The server validates the CNPJ (numeric or alphanumeric,
        test-vectors/cnpj.json), then reads it from its copy of Receita Federal's open data.
        When the CNPJ is not in the current copy yet, the claim waits in status
        registry_pending until the next scan. A CNPJ that another account already verified
        is refused with cnpj_taken.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cnpj]
              properties:
                cnpj: { type: string, maxLength: 32, description: "With or without separators." }
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessClaim" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      summary: Withdraw the caller's claim (also ends a verification)
      security: [{ matrix: [] }]
      responses:
        "204": { description: Withdrawn }
  /v1/me/business/ecnpj:
    post:
      summary: Prove control with the company's e-CNPJ certificate
      description: >
        The body carries a CMS (PKCS#7, .p7s) signature over the exact claim challenge text,
        attached or detached, made with an ICP-Brasil e-CNPJ certificate. The server checks the
        signature, the chain to a pinned ICP-Brasil root, the validity dates, and that the CNPJ in
        the certificate has the same root (first 8 characters) as the claimed CNPJ. The registry
        must show the CNPJ as active.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature: { type: string, maxLength: 65536, description: "Base64 of the DER-encoded CMS SignedData." }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessClaim" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/me/business/domains:
    post:
      summary: Add a domain to the caller's claim (ADR 0036)
      description: Returns the DNS TXT record the company must publish. Up to 5 domains per claim.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, maxLength: 253 }
      responses:
        "201":
          description: Domain added, not verified yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDomain" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/me/business/domains/{domain}/check:
    post:
      summary: Look up the domain's TXT record now
      security: [{ matrix: [] }]
      parameters:
        - { name: domain, in: path, required: true, schema: { type: string, maxLength: 253 } }
      responses:
        "200":
          description: Result; verified_at is set when the record matched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDomain" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/handle:
    get:
      summary: The caller's handle
      security: [{ matrix: [] }]
      responses:
        "200":
          description: Current handle and when it can next change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyHandle" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      summary: Set or change the caller's handle (30-day cooldown; old handle held 90 days)
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handle]
              properties:
                handle: { type: string }
      responses:
        "200":
          description: Handle set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyHandle" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove the caller's handle (ADR 0066)
      description: >
        Allowed at any time. The old handle is held 90 days, as on a change. The removal does not
        reset the cooldown: changeable_at is 30 days after the last set. The API records the removal
        in the handle change history.
      security: [{ matrix: [] }]
      responses:
        "200":
          description: Handle removed (also when the caller had none). No handle field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyHandle" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/handle-changes:
    post:
      summary: Handle change history for Matrix IDs the caller shares rooms with (ADR 0066)
      description: >
        The app sends the Matrix IDs of the members of its joined rooms (1:1 and groups). The API
        does not check room membership. It returns first sets, changes and removals from the last
        365 days (at most the last 20 per account), oldest first. Each change becomes a local
        timeline line at "at" in every room the person is a member of: old and new set is
        bipe_handle_changed (name, new, old); only new is bipe_handle_set (name, new); only old is
        bipe_handle_removed (name, old). The name is the person's display name in that room.
        A handle chosen at sign-up is not a change. Holds and cooldowns are never in the history.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_ids]
              properties:
                user_ids: { type: array, maxItems: 100, items: { type: string } }
                since: { type: string, format: date-time, description: "Only changes after this time. The app sends the latest at it already has." }
      responses:
        "200":
          description: Changes for the given IDs. IDs without changes are absent.
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes: { type: array, items: { $ref: "#/components/schemas/HandleChange" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/profiles/{handle}:
    get:
      summary: Public profile by exact handle (ADR 0041)
      description: >
        No auth. CORS for the public site. Rate-limited per IP. The same 404 for "no such handle"
        and "profile off". No search and no directory. Never returns the Matrix ID: apps that
        start a chat call GET /v1/handles/{handle} with a token.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Published profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfile" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/profiles/{handle}/photo:
    get:
      summary: Profile photo (JPEG, metadata removed by the server)
      description: No auth. Same visibility as the profile. The URL changes when the photo changes.
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
        - { name: v, in: query, required: false, schema: { type: string }, description: "Photo version from photo_url. Ignored by the server; it busts caches." }
      responses:
        "200":
          description: The photo
          content:
            image/jpeg: {}
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/profile:
    get:
      summary: The caller's public profile, published or not
      security: [{ matrix: [] }]
      responses:
        "200":
          description: Current profile. A user who never saved one gets enabled false and an empty name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyProfile" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      summary: Save the caller's public profile and turn it on or off
      description: >
        Turning it on needs a handle (400 profile_invalid, reason no_handle). Name and bio follow
        registries/profiles.json and the reserved names (reason: a ProfileProblem id).
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/profile/photo:
    put:
      summary: Replace the caller's profile photo
      description: >
        Body is a baseline or progressive JPEG, at most photoMaxBytes and photoMaxPixels on each side
        (registries/profiles.json). Apps re-encode before upload. The server removes every APPn and
        COM segment (EXIF, GPS, XMP) and stores only the result.
      security: [{ matrix: [] }]
      requestBody:
        required: true
        content:
          image/jpeg: {}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyProfile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove the caller's profile photo
      security: [{ matrix: [] }]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyProfile" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/admin/inviters:
    get:
      summary: Staff report of inviters ranked by joins
      description: >
        Only for users that MAS marks admin (bipe/docs/adr ADR 0056); every other user gets 404 not_found, so the route does not show that it exists.
        Covers personal invites only. CORS allows PUBLIC_SITE_URL.
      security: [{ matrix: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        "200":
          description: Inviters, most joins first
          content:
            application/json:
              schema:
                type: object
                required: [inviters]
                properties:
                  inviters: { type: array, items: { $ref: "#/components/schemas/InviterStats" } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  securitySchemes:
    matrix:
      type: http
      scheme: bearer
      description: Matrix access token from MAS. The API checks it with Synapse whoami.
  schemas:
    ExperimentEvent:
      type: object
      required: [experiment, arm, event]
      properties:
        experiment: { type: string, pattern: "^[a-z0-9-]{1,32}$", example: headline-77 }
        arm: { type: string, pattern: "^h[0-9]$", description: "h0 is the control." }
        event: { type: string, enum: [assign, install_click], description: "assign: a browser got its arm (once per browser). install_click: a click on the TestFlight link." }
    BusinessClaim:
      type: object
      required: [cnpj, status, domains, reserved_names]
      properties:
        cnpj: { type: string, description: "14 characters, digits and uppercase letters, no separators." }
        status:
          type: string
          enum: [registry_pending, awaiting_proof, verified, rejected, revoked]
          description: >
            registry_pending: waiting for the next scan of the registry copy.
            awaiting_proof: the CNPJ is active; prove control.
            verified: proof accepted. rejected: the registry shows the CNPJ is not active.
            revoked: a later check or staff ended the verification (see reason).
        reason: { type: string, description: "Why the claim is rejected or revoked, e.g. not_active, staff." }
        registry: { $ref: "#/components/schemas/CnpjRegistryRecord" }
        challenge: { type: string, description: "Text to sign with the e-CNPJ certificate. Present while status is awaiting_proof." }
        method: { type: string, enum: [ecnpj, partner, staff] }
        verified_at: { type: string, format: date-time }
        domains: { type: array, items: { $ref: "#/components/schemas/BusinessDomain" } }
        reserved_names:
          type: array
          description: Reserved names that the registered names match, and whether staff approved them for this company.
          items:
            type: object
            required: [name, approved]
            properties:
              name: { type: string }
              approved: { type: boolean }
    CnpjRegistryRecord:
      type: object
      required: [active, legal_name, checked_month]
      properties:
        active: { type: boolean }
        legal_name: { type: string, description: "Razão social." }
        trade_name: { type: string, description: "Nome fantasia, when the registry has one." }
        checked_month: { type: string, description: "The Receita Federal release the record comes from, YYYY-MM." }
    BusinessDomain:
      type: object
      required: [domain, txt_name, txt_value]
      properties:
        domain: { type: string }
        txt_name: { type: string, description: "Where to publish the record, e.g. _bipe.example.com.br" }
        txt_value: { type: string }
        verified_at: { type: string, format: date-time }
    WaitlistRequest:
      type: object
      required: [email, platform]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        platform: { type: string, enum: [android, ios, other], description: "The platform the person waits for." }
        lang: { type: string, enum: [pt, en], default: pt, description: "Language of the one email Bipe sends." }
        source: { type: string, maxLength: 64, pattern: "^[a-z0-9:/_.-]*$", description: "Where the form was: the page path, plus ':' and the headline arm when a test runs (issue #77), for example /baixar/ or /:h2." }
        website: { type: string, maxLength: 200, description: "Honeypot. People leave it empty; a non-empty value is accepted and dropped." }
    PartnerRequest:
      type: object
      required: [organisation, name, email, kind]
      properties:
        organisation: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 120, description: "The contact person." }
        email: { type: string, format: email, maxLength: 254 }
        kind: { type: string, enum: [funder, tech, bank, research, civil, public, other], description: "Kind of organisation, as listed on the partner page." }
        message: { type: string, maxLength: 2000, description: "How the organisation wants to help. Optional." }
        lang: { type: string, enum: [pt, en], default: pt }
        website: { type: string, maxLength: 200, description: "Honeypot. People leave it empty; a non-empty value is accepted and dropped." }
    SignupRequest:
      type: object
      properties:
        invite_code: { type: string, maxLength: 2048, description: "Optional while the server runs with SIGNUP_INVITE_REQUIRED=false (beta). A code, an invite link or a whole pasted message; the server extracts the code (test-vectors/invite-codes.json). A given code must be valid." }
        email: { type: string, format: email, maxLength: 254, description: "Device-first: optional recovery fallback, confirmed by a link. Legacy: the login, required with password." }
        password: { type: string, minLength: 8, maxLength: 256, description: "Legacy only. Absent: device-first, the server makes the password." }
        pin: { type: string, maxLength: 64, description: "Device-first only, optional: the PIN, set at once. Must pass pinProblem() (400 pin_weak)." }
        lang: { type: string, enum: [pt, en], default: pt, description: "Language of the emails Bipe sends to the recovery email." }
        handle: { type: string, description: "Optional. Without @." }
        display_name: { type: string, maxLength: 100 }
        attestation: { $ref: "#/components/schemas/Attestation" }
    Attestation:
      type: object
      required: [key_id, attestation_object, challenge]
      description: Apple App Attest result. Required while the server runs with SIGNUP_ATTEST_REQUIRED (not false). Android uses Play Integrity later.
      properties:
        key_id: { type: string, description: "Base64 key ID from DCAppAttestService.generateKey" }
        attestation_object: { type: string, description: "Base64 attestation object" }
        challenge: { type: string, description: "From POST /v1/attest/challenge" }
    MessagingSetting:
      type: object
      required: [who_can_message]
      properties:
        who_can_message: { type: string, enum: [everyone, verified, contacts], description: "everyone: invites from strangers arrive in Pedidos. contacts: only people you share a room with or your invite pair." }
    SignupResponse:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, description: "Random Matrix ID, e.g. @k7q2m9x4tpab:bipe.net.br" }
        handle: { type: string }
        inviter_user_id: { type: string, description: "Present when a personal invite was used. The app can offer a chat with the inviter." }
        password: { type: string, description: "Device-first only. The hidden MAS password, shown once. Keep it on this device only." }
        recovery_token: { type: string, description: "Device-first only. base64url, 32 random bytes, shown once. Sync it (iCloud Keychain, Block Store)." }
    DiscoverySettings:
      type: object
      required: [by_phone]
      properties:
        by_phone: { type: boolean, description: "People who have the caller's number can find them. Default true." }
    InvitePreview:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean, description: "False when the code is unknown, used, expired or revoked. No reason is given." }
        inviter_handle: { type: string, description: "Only for a valid personal invite whose inviter has a handle. Without @." }
    InviteStatus:
      type: string
      enum: [pending, used, expired, revoked]
    Invite:
      type: object
      required: [id, status, created_at, expires_at]
      properties:
        id: { type: string }
        status: { $ref: "#/components/schemas/InviteStatus" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        joined_user_id: { type: string, description: "Only when status is used: the account created with this invite." }
    InviterStats:
      type: object
      required: [user_id, sent, joined, downstream, depth]
      properties:
        user_id: { type: string }
        handle: { type: [string, "null"] }
        sent: { type: integer, description: "Personal invites the user created." }
        joined: { type: integer, description: "People who signed up with those invites." }
        rate_pct: { type: [integer, "null"], description: "joined / sent, in percent." }
        downstream: { type: integer, description: "Everyone below the user in the invite tree, all levels." }
        depth: { type: integer, description: "Levels in the user's invite tree." }
        last_join: { type: [string, "null"], format: date-time }
    MyInvites:
      type: object
      required: [quota, available, invites]
      properties:
        quota: { type: integer, description: "Slots the caller has. A pending invite holds a slot until it expires or is revoked; a used invite holds it for INVITE_RESPAWN_DAYS (default 7) after the invitee joined." }
        available: { type: integer, description: "Invites the caller can create now." }
        next_available_at: { type: string, format: date-time, description: "Only when available is 0: when the next slot comes back." }
        invites: { type: array, items: { $ref: "#/components/schemas/Invite" } }
    CreatedInvite:
      type: object
      required: [id, code, url, expires_at]
      properties:
        id: { type: string }
        code: { type: string, description: "Shown once. Format XXXX-XXXX-XXXX." }
        url: { type: string, description: "https://bipe.chat/convite/<code>, a universal link into the app." }
        expires_at: { type: string, format: date-time }
    HandleAvailability:
      type: object
      required: [handle, available]
      properties:
        handle: { type: string }
        available: { type: boolean }
        reason: { $ref: "#/components/schemas/HandleProblem" }
    HandleProblem:
      type: string
      enum: [too_short, too_long, invalid_characters, reserved, taken]
      description: Same ids as bipe-shared handleProblem(); "taken" also covers held and lookalike handles.
    HandleRecord:
      type: object
      required: [handle, user_id]
      properties:
        handle: { type: string }
        user_id: { type: string }
    MyHandle:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        handle: { type: string }
        changeable_at: { type: string, format: date-time, description: "Absent when a change is allowed now." }
    HandleChange:
      type: object
      required: [user_id, at]
      properties:
        user_id: { type: string }
        old: { type: string, description: "Handle before the change, without @. Absent on a first set." }
        new: { type: string, description: "Handle after the change, without @. Absent on a removal." }
        at: { type: string, format: date-time }
    PublicProfile:
      type: object
      required: [handle, name]
      properties:
        handle: { type: string }
        name: { type: string }
        bio: { type: string, description: "Plain text. Absent when empty." }
        photo_url: { type: string, description: "Absolute URL of GET /v1/profiles/{handle}/photo with a version. Absent without a photo." }
        badge: { $ref: "#/components/schemas/BadgeEnvelope" }
    MyProfile:
      type: object
      required: [enabled, name, bio, has_photo]
      properties:
        enabled: { type: boolean }
        name: { type: string }
        bio: { type: string }
        has_photo: { type: boolean }
        handle: { type: string, description: "Absent when the caller has no handle." }
        photo_url: { type: string, description: "Absent without a photo." }
    ProfileUpdate:
      type: object
      required: [enabled, name, bio]
      properties:
        enabled: { type: boolean }
        name: { type: string }
        bio: { type: string }
    ProfileProblem:
      type: string
      enum: [name_empty, name_too_long, name_reserved, bio_too_long, bio_too_many_lines, no_handle]
      description: Same ids as bipe-shared profileProblem(), plus no_handle from the server.
    PinProblem:
      type: string
      enum: [not_digits, wrong_length, repeated_digit, sequence, date]
      description: Same ids as bipe-shared pinProblem() (registries/accounts.json, test-vectors/pins.json).
    Credentials:
      type: object
      required: [user_id, password, recovery_token]
      description: Shown once. The app keeps the password on this device only and syncs the recovery token. Sign in with m.login.password.
      properties:
        user_id: { type: string }
        password: { type: string, description: "base64url, 32 random bytes." }
        recovery_token: { type: string, description: "base64url, 32 random bytes." }
    Recovery:
      type: object
      required: [id, method, purpose, state, created_at]
      properties:
        id: { type: string }
        method: { type: string, enum: [token, email, guardian, cpf], description: "guardian and cpf are not built yet." }
        purpose: { type: string, enum: [access, pin_reset] }
        state: { type: string, enum: [waiting, completed, cancelled, expired] }
        created_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time, description: "When the delay ends." }
        ended_at: { type: string, format: date-time }
    RecoveryStarted:
      type: object
      required: [recovery_id, claim_secret, purpose, ready_at]
      properties:
        recovery_id: { type: string }
        claim_secret: { type: string, description: "Shown once. Keep it on the new device." }
        purpose: { type: string, enum: [access, pin_reset] }
        ready_at: { type: string, format: date-time }
    RecoveryClaim:
      type: object
      required: [state, purpose]
      properties:
        state: { type: string, enum: [waiting, completed, cancelled, expired] }
        purpose: { type: string, enum: [access, pin_reset] }
        ready_at: { type: string, format: date-time }
        user_id: { type: string, description: "Access, completed by this call only." }
        password: { type: string, description: "Access, completed by this call only. Shown once." }
        recovery_token: { type: string, description: "Access, completed by this call only. Shown once." }
    AccountStatus:
      type: object
      required: [user_id, pin_set, pin_blocked, pin_tries_left, device_first, recovery_token_set, recoveries]
      properties:
        user_id: { type: string }
        pin_set: { type: boolean }
        pin_blocked: { type: boolean }
        pin_tries_left: { type: integer }
        device_first: { type: boolean, description: "False for a beta account that still signs in with its own password (POST /v1/me/device-first)." }
        recovery_token_set: { type: boolean }
        email: { type: string, description: "The verified recovery email. Absent when none." }
        email_pending: { type: string, description: "An address waiting for its link. Absent when none." }
        recoveries: { type: array, items: { $ref: "#/components/schemas/Recovery" }, description: "Waiting ones, and ones that ended in the last 7 days. Newest first." }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [bad_request, invite_invalid, invite_quota_exhausted, email_taken, handle_invalid, handle_taken, handle_cooldown, password_weak, attestation_invalid, profile_invalid, photo_invalid, unauthorized, not_found, rate_limited, internal, cnpj_invalid, cnpj_not_active, cnpj_taken, signature_invalid, pin_weak, pin_wrong, pin_blocked, pin_not_set, recovery_invalid, email_unavailable]
        reason: { type: string, description: "Detail, e.g. a HandleProblem or PinProblem id." }
        tries_left: { type: integer, description: "With pin_wrong: wrong PINs left before the PIN blocks." }
    BadgeEnvelope:
      type: object
      required: [v, kid, payload, sig]
      properties:
        v: { type: integer, const: 1 }
        kid: { type: string }
        payload: { type: string, description: "base64url JSON payload bytes" }
        sig: { type: string, description: "base64url Ed25519 signature" }
    PixChallenge:
      type: object
      required: [verificationId, brcode, amountCents, expiresAt]
      properties:
        verificationId: { type: string }
        brcode: { type: string, description: "Pix copia-e-cola payload; also rendered as QR" }
        amountCents: { type: integer, const: 1 }
        expiresAt: { type: string, format: date-time }
    VerificationStatus:
      type: object
      required: [verificationId, state]
      properties:
        verificationId: { type: string }
        state: { type: string, enum: [pending, verified, rejected, expired] }
        badge: { $ref: "#/components/schemas/BadgeEnvelope" }
