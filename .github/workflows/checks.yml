# ADR 0031: the shared rules, the generated code in every repo and the API clients stay in step.
# Needs the secret BIPE_REPOS_TOKEN: a fine-grained token with read access to contents of
# bipe, bipe-ios, bipe-android and bipe-api (the repos are private).
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *" # daily: catches a sibling repo that drifted on its own
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bipe-shared
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-ios
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe-ios
          lfs: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-android
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe-android
          lfs: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-api
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contract
        run: node bipe-shared/tools/check-contract.mjs
      - name: Trust facts
        run: node --test bipe-shared/tools/trust-facts.test.mjs
      - name: Drift
        run: node bipe-shared/tools/check-drift.mjs --against head --repos "$GITHUB_WORKSPACE"
