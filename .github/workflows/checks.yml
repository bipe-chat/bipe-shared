# ADR 0031, ADR 0092: the shared rules, the generated code in every repo, the API clients and the parity ledger stay in step.
# Needs the secret BIPE_REPOS_TOKEN: a fine-grained token with read access to contents of
# bipe, bipe-ios, bipe-android, bipe-api, bipe-web and bipe-infra.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * *" # daily: catches a sibling repo that drifted on its own
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trust-facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Shared rules and contract types
        run: node --test tools/*.test.mjs
  lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: bipe-shared
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-ios
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe-ios
          lfs: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-android
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe-android
          lfs: false
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-api
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe-api
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-web
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe-web
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-infra
          token: ${{ secrets.BIPE_REPOS_TOKEN }}
          path: bipe-infra
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Contract
        run: node bipe-shared/tools/check-contract.mjs
      - name: Drift
        run: node bipe-shared/tools/check-drift.mjs --against head --repos "$GITHUB_WORKSPACE"
      - name: Parity
        run: node bipe-shared/tools/parity.mjs --against head --repos "$GITHUB_WORKSPACE"
